name: Build release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Compute release tag
        id: ts
        run: echo "tag=$(date -u +%Y%m%d%H%M)" | tee -a "$GITHUB_OUTPUT"

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y quilt
          sudo ln -sf "$(command -v readlink)" /usr/local/bin/greadlink

      - name: Build Chromium extension
        run: |
          source dev.sh
          pdf setup
          pdf build

      - name: Make release tarball
        env:
          TAG: ${{ steps.ts.outputs.tag }}
        run: |
          cd build/chromium
          find . -print0 \
          | sort -z \
          | GZIP="-9n" tar -zcf "/tmp/helium-pdfjs-$TAG.tar.gz" \
              --format=posix \
              --numeric-owner \
              --owner=0 \
              --group=0 \
              --pax-option='delete=atime,delete=ctime' \
              --mode='go+u,go-w' \
              --preserve-permissions \
              --mtime='1970-01-01' \
              --no-recursion \
              --null \
              --files-from -

      - name: Make release body
        run: |
          cd /tmp
          echo '```' > release.md
          sha256sum helium-pdfjs-*.tar.gz >> release.md
          echo '```' >> release.md

      - name: Release
        uses: imputnet/action-gh-release@v2.5
        with:
          body_path: /tmp/release.md
          draft: false
          prerelease: true
          files: /tmp/helium-pdfjs-${{ steps.ts.outputs.tag }}.tar.gz
          name: ${{ steps.ts.outputs.tag }}
          tag_name: ${{ steps.ts.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
